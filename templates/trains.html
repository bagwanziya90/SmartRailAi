<!DOCTYPE html>
<html>
<head>

    <title>Available Trains</title>

    <style>

        body {
            font-family: Arial;
            background: #eef3f8;
            margin: 0;
        }

        header {
            background: #12355b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        table {
            width: 90%;
            margin: 40px auto;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 4px 15px #bbb;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background: #1769aa;
            color: white;
        }

        tr:hover {
            background: #f2f2f2;
        }

        a {
            display: block;
            width: 100px;
            margin: 20px auto;
            padding: 12px;
            background: #1769aa;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 7px;
        }

    </style>

</head>

<body>

<header>
    <h1>🚆 Available Trains</h1>
</header>

<table>

    <tr>
        <th>Train ID</th>
        <th>Train Name</th>
        <th>From</th>
        <th>To</th>
        <th>Departure</th>
        <th>Arrival</th>
        <th>Seats</th>
    </tr>

    {% for train in trains %}

    <tr>

        <td>{{ train.train_id }}</td>

        <td>{{ train.train_name }}</td>

        <td>{{ train.source }}</td>

        <td>{{ train.destination }}</td>

        <td>{{ train.departure }}</td>

        <td>{{ train.arrival }}</td>

        <td>{{ train.seats }}</td>

    </tr>

    {% endfor %}

</table>

<a href="/">🏠 Home</a>

</body>
</html>
