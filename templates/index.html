<!DOCTYPE html>
<html>
<head>
    <title>SmartRailAI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f8;
        }

        header {
            background: #12355b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 42px;
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #bbb;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #1769aa;
            color: white;
            padding: 14px 25px;
            margin: 10px;
            border-radius: 8px;
        }

        a:hover {
            background: #0d47a1;
        }
    </style>
</head>

<body>

<header>
    <h1>🚆 SmartRailAI</h1>
    <p>Railway Management System</p>
</header>

<div class="container">

    <div class="card">

        <h2>Welcome to SmartRailAI</h2>

        <p>
            Search trains, check train information
            and book railway tickets easily.
        </p>

        <a href="/trains">🚆 View Trains</a>

        <a href="/booking">🎫 Book Ticket</a>

    </div>

</div>

</body>
</html>
