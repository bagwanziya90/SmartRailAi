<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Ticket</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .booking-box {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c62828;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="booking-box">

    <h1>🎫 Book Your Ticket</h1>

    {% if message %}

        <div class="message">
            {{ message }}
        </div>

    {% endif %}


    <form method="POST"
          action="{{ url_for('bookings') }}">

        <!-- Passenger Name -->

        <label>
            Passenger Name
        </label>

        <input
            type="text"
            name="name"
            placeholder="Enter passenger name"
            required
        >


        <!-- Age -->

        <label>
            Age
        </label>

        <input
            type="number"
            name="age"
            min="1"
            max="120"
            placeholder="Enter age"
            required
        >


        <!-- Gender -->

        <label>
            Gender
        </label>

        <select name="gender" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>


        <!-- Phone -->

        <label>
            Phone Number
        </label>

        <input
            type="tel"
            name="phone"
            placeholder="Enter phone number"
            required
        >


        <!-- Journey Date -->

        <label>
            Journey Date
        </label>

        <input
            type="date"
            name="journey_date"
            required
        >


        <!-- Train -->

        <label>
            Select Train
        </label>

        <select name="train_id" required>

            <option value="">
                Select Train
            </option>

            {% for train in trains %}

                {% if train.seats > 0 %}

                    <option value="{{ train.train_id }}">

                        {{ train.train_name }}

                        -
                        {{ train.source }}

                        →

                        {{ train.destination }}

                        -
                        ₹{{ train.fare }}

                        -
                        {{ train.seats }} seats

                    </option>

                {% endif %}

            {% endfor %}

        </select>


        <!-- Number of Seats -->

        <label>
            Number of Seats
        </label>

        <input
            type="number"
            name="seats"
            min="1"
            max="10"
            value="1"
            required
        >


        <!-- Book -->

        <button type="submit">
            🎫 Book Ticket
        </button>

    </form>


    <a href="{{ url_for('trains') }}"
       class="back">

        ← Back to Trains

    </a>

</div>

</body>

</html>
    <a href="/">Back to Home</a>

</body>
</html>
